<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Golden wireframe cube, all 12 edges visible, tilted upper-left -->
  <!-- Front face (dimmer) -->
  <line x1="18" y1="20" x2="46" y2="20" stroke="rgba(180,150,60,0.60)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="46" y1="20" x2="46" y2="48" stroke="rgba(180,150,60,0.60)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="46" y1="48" x2="18" y2="48" stroke="rgba(180,150,60,0.60)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="48" x2="18" y2="20" stroke="rgba(180,150,60,0.60)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Back face (brighter) -->
  <line x1="10" y1="12" x2="38" y2="12" stroke="rgba(255,235,160,0.92)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="38" y1="12" x2="38" y2="40" stroke="rgba(255,235,160,0.92)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="38" y1="40" x2="10" y2="40" stroke="rgba(255,235,160,0.92)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="10" y1="40" x2="10" y2="12" stroke="rgba(255,235,160,0.92)" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Connecting edges (brighter) -->
  <line x1="18" y1="20" x2="10" y2="12" stroke="rgba(255,235,160,0.92)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="46" y1="20" x2="38" y2="12" stroke="rgba(255,235,160,0.92)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="46" y1="48" x2="38" y2="40" stroke="rgba(255,235,160,0.92)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="18" y1="48" x2="10" y2="40" stroke="rgba(255,235,160,0.92)" stroke-width="1.2" stroke-linecap="round"/>
</svg>
