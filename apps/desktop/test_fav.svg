<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cubeGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
    <linearGradient id="cubeGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <linearGradient id="cubeGrad3" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
  </defs>

  <!-- 背景圆角方底 -->
  <rect width="64" height="64" rx="16" fill="#123a8c"/>

  <!-- 等轴测立方体 — 顶面 -->
  <polygon
    points="32,14 18,24 32,34 46,24"
    fill="url(#cubeGrad1)"
    stroke="rgba(255,255,255,0.35)"
    stroke-width="1.2"
    stroke-linejoin="round"
  />
  <!-- 等轴测立方体 — 左面 -->
  <polygon
    points="18,24 18,40 32,50 32,34"
    fill="url(#cubeGrad2)"
    stroke="rgba(255,255,255,0.25)"
    stroke-width="1.2"
    stroke-linejoin="round"
  />
  <!-- 等轴测立方体 — 右面 -->
  <polygon
    points="32,34 32,50 46,40 46,24"
    fill="url(#cubeGrad3)"
    stroke="rgba(255,255,255,0.28)"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- 外轮廓强调线 -->
  <polyline
    points="18,24 32,14 46,24 46,40 32,50 18,40 18,24"
    fill="none"
    stroke="rgba(255,255,255,0.50)"
    stroke-width="1.6"
    stroke-linejoin="round"
  />
  <!-- 内部棱边 -->
  <line x1="32" y1="34" x2="32" y2="50" stroke="rgba(255,255,255,0.42)" stroke-width="1"/>
  <line x1="32" y1="34" x2="46" y2="24" stroke="rgba(255,255,255,0.28)" stroke-width="0.7"/>
  <line x1="32" y1="34" x2="18" y2="24" stroke="rgba(255,255,255,0.28)" stroke-width="0.7"/>

  <!-- 内部小球 -->
  <circle cx="32" cy="34" r="7" fill="url(#ballGrad)" opacity="0.85"/>
  <!-- 小球高光 -->
  <circle cx="30" cy="32" r="3" fill="rgba(255,255,255,0.30)"/>
</svg>
